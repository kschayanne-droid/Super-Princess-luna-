<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Princesa Luna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
            touch-action: none;
            -webkit-touch-callout: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 100%;
            padding: 10px;
            width: 100%;
        }
        canvas {
            border: 4px solid #c084fc;
            background: linear-gradient(to bottom, #38bdf8, #bae6fd);
            box-shadow: 0 20px 40px rgba(192, 132, 252, 0.45);
            width: 100%;
            max-width: 800px;
            height: auto;
            aspect-ratio: 2 / 1;
            border-radius: 16px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .ui-panel {
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-play {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: 3px solid #fbcfe8;
            padding: 14px 32px;
            font-size: 1.15rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
            transition: transform 0.1s ease, filter 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-play:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        .btn-play:active {
            transform: scale(0.96);
        }
        .inst {
            font-size: 0.9rem;
            color: #d8b4fe;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="inst">👑 BRUXAS (-30 PTS) | ESPINHOS/CANOS (GAME OVER) | +1000 PTS = NOITE!</div>
        <div class="ui-panel">
            <button class="btn-play" onclick="triggerJumpOrRestart()">🎮 PULAR / RECOMEÇAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let highscore = 0;
        let gameSpeed = 11;
        let frameCount = 0;
        let gameOver = false;
        let gameStarted = false;

        const luna = {
            x: 90,
            y: 215,
            width: 58,
            height: 78,
            vy: 0,
            jumpPower: -11.0,
            gravity: 0.7,
            isJumping: false
        };

        let obstacles = [];
        let flowers = [];
        let springs = [];
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        window.addEventListener("touchstart", handleInput, { passive: false });
        window.addEventListener("click", handleInput);

        function handleInput(e) {
            initAudio();
            if (e && e.target && e.target.tagName === 'BUTTON') return;
            triggerJumpOrRestart();
            if (e && e.type === "touchstart") e.preventDefault();
        }

        function triggerJumpOrRestart() {
            initAudio();
            gameStarted = true;
            if (!luna.isJumping && !gameOver) {
                luna.vy = luna.jumpPower;
                luna.isJumping = true;
                playTone(600, "square", 0.15);
            } else if (gameOver) {
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            gameSpeed = 11;
            obstacles = [];
            flowers = [];
            springs = [];
            luna.y = 215;
            luna.vy = 0;
            luna.isJumping = false;
            gameOver = false;
        }

        function update() {
            if (gameOver || !gameStarted) return;

            frameCount++;
            score += 0.8;

            gameSpeed = 11 + Math.floor(score / 120) * 0.5;
            if (gameSpeed > 20) gameSpeed = 20;

            luna.y += luna.vy;
            luna.vy += luna.gravity;
            if (luna.y > 215) {
                luna.y = 215;
                luna.vy = 0;
                luna.isJumping = false;
            }

            if (frameCount % Math.max(35, 78 - Math.floor(gameSpeed * 2.0)) === 0) {
                let types = ['witch', 'castle', 'spike'];
                let t = types[Math.floor(Math.random() * types.length)];
                let w = t === 'witch' ? 52 : t === 'spike' ? 32 : 46;
                let h = t === 'witch' ? 44 : t === 'spike' ? 30 : 62;
                let y = t === 'witch' ? 175 : t === 'spike' ? 264 : 232;
                obstacles.push({ x: canvas.width, y, w, h, type: t, hit: false });
            }

            if (frameCount % 60 === 0) {
                flowers.push({ x: canvas.width, y: 110 + Math.random() * 110, w: 28, h: 28, rot: 0 });
            }

            if (frameCount % 160 === 0) {
                springs.push({ x: canvas.width, y: 264, w: 32, h: 30 });
            }

            for (let i = flowers.length - 1; i >= 0; i--) {
                let f = flowers[i];
                f.x -= gameSpeed;
                f.rot += 0.05;
                if (luna.x < f.x + f.w && luna.x + luna.width > f.x && luna.y < f.y + f.h && luna.y + luna.height > f.y) {
                    score += 150;
                    playTone(950, "triangle", 0.12);
                    flowers.splice(i, 1);
                } else if (f.x < -40) {
                    flowers.splice(i, 1);
                }
            }

            for (let i = springs.length - 1; i >= 0; i--) {
                let sp = springs[i];
                sp.x -= gameSpeed;
                if (luna.x < sp.x + sp.w && luna.x + luna.width > sp.x && luna.y < sp.y + sp.h && luna.y + luna.height > sp.y) {
                    luna.vy = -16;
                    luna.isJumping = true;
                    playTone(700, "square", 0.2);
                    springs.splice(i, 1);
                } else if (sp.x < -40) {
                    springs.splice(i, 1);
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.x -= gameSpeed;
                if (!o.hit && luna.x + 8 < o.x + o.w - 8 && luna.x + luna.width - 8 > o.x + 8 && luna.y + 6 < o.y + o.h && luna.y + luna.height > o.y + 6) {
                    if (o.type === 'witch') {
                        o.hit = true;
                        score = Math.max(0, score - 30);
                        playTone(180, "sawtooth", 0.25);
                    } else {
                        gameOver = true;
                        if (score > highscore) highscore = score;
                        playTone(120, "sawtooth", 0.4);
                    }
                }
                if (o.x < -50) obstacles.splice(i, 1);
            }
        }

        function draw() {
            let nightFactor = score >= 1000 ? Math.min(1, (score - 1000) / 250) : 0;
            
            let r = Math.floor(56 + (6 - 56) * nightFactor);
            let g = Math.floor(189 + (12 - 189) * nightFactor);
            let b = Math.floor(248 + (32 - 248) * nightFactor);
            
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (nightFactor > 0) {
                ctx.save();
                ctx.globalAlpha = nightFactor;
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(80, 40, 3, 3);
                ctx.fillRect(220, 30, 4, 4);
                ctx.fillRect(380, 55, 3, 3);
                ctx.fillRect(520, 25, 4, 4);
                ctx.fillRect(680, 45, 3, 3);
                ctx.fillRect(750, 75, 4, 4);

                ctx.fillStyle = "#fef08a";
                ctx.beginPath();
                ctx.arc(710, 70, 28, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            let castleAlpha = 0.35 + (nightFactor * 0.15);
            ctx.save();
            ctx.globalAlpha = castleAlpha;
            let castleWallColor = nightFactor > 0.5 ? "#64748b" : "#94a3b8";
            let castleStoneDark = nightFactor > 0.5 ? "#475569" : "#64748b";
            let castleRoofColor = nightFactor > 0.5 ? "#334155" : "#475569";

            ctx.fillStyle = castleWallColor;
            ctx.fillRect(500, 150, 160, 144);
            ctx.fillRect(470, 170, 50, 124);
            ctx.fillRect(640, 170, 50, 124);

            ctx.fillStyle = castleRoofColor;
            ctx.beginPath();
            ctx.moveTo(460, 170); ctx.lineTo(495, 105); ctx.lineTo(530, 170); ctx.closePath();
            ctx.moveTo(540, 150); ctx.lineTo(580, 75); ctx.lineTo(620, 150); ctx.closePath();
            ctx.moveTo(630, 170); ctx.lineTo(665, 105); ctx.lineTo(700, 170); ctx.closePath();
            ctx.fill();

            ctx.fillStyle = castleStoneDark;
            ctx.beginPath();
            ctx.arc(580, 230, 22, Math.PI, 0, false);
            ctx.lineTo(602, 294);
            ctx.lineTo(558, 294);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            let floorR = Math.floor(21 + (10 - 21) * nightFactor);
            let floorG = Math.floor(128 + (15 - 128) * nightFactor);
            let floorB = Math.floor(61 + (25 - 61) * nightFactor);
            ctx.fillStyle = `rgb(${floorR}, ${floorG}, ${floorB})`;
            ctx.fillRect(0, 294, canvas.width, 106);

            let topFloorR = Math.floor(34 + (15 - 34) * nightFactor);
            let topFloorG = Math.floor(197 + (23 - 197) * nightFactor);
            let topFloorB = Math.floor(94 + (38 - 94) * nightFactor);
            ctx.fillStyle = `rgb(${topFloorR}, ${topFloorG}, ${topFloorB})`;
            ctx.fillRect(0, 294, canvas.width, 12);

            flowers.forEach(f => {
                ctx.save();
                ctx.translate(f.x + 14, f.y + 14);
                ctx.rotate(f.rot);
                ctx.fillStyle = "#ec4899";
                for (let p = 0; p < 5; p++) {
                    ctx.rotate((Math.PI * 2) / 5);
                    ctx.beginPath();
                    ctx.arc(0, 8, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = "#facc15";
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            springs.forEach(sp => {
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(sp.x, sp.y + 14, sp.w, 16);
                ctx.fillStyle = "#f87171";
                ctx.fillRect(sp.x + 4, sp.y + 4, 24, 12);
            });

            obstacles.forEach(o => {
                if (o.type === 'witch') {
                    ctx.fillStyle = "#7e22ce";
                    ctx.beginPath();
                    ctx.ellipse(o.x + 26, o.y + 24, 18, 14, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#0f172a";
                    ctx.beginPath();
                    ctx.moveTo(o.x + 10, o.y + 16);
                    ctx.lineTo(o.x + 36, o.y - 6);
                    ctx.lineTo(o.x + 44, o.y + 16);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = "#4ade80";
                    ctx.beginPath();
                    ctx.arc(o.x + 26, o.y + 20, 7, 0, Math.PI * 2);
                    ctx.fill();
                } else if (o.type === 'spike') {
                    ctx.fillStyle = "#b91c1c";
                    ctx.beginPath();
                    ctx.moveTo(o.x, o.y + o.h);
                    ctx.lineTo(o.x + o.w / 2, o.y);
                    ctx.lineTo(o.x + o.w, o.y + o.h);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillStyle = "#16a34a";
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                    ctx.fillStyle = "#4ade80";
                    ctx.fillRect(o.x - 3, o.y, o.w + 6, 12);
                }
            });

            let lx = luna.x;
            let ly = luna.y;

            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.ellipse(lx + 16, ly + 24, 16, 20, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(lx + 20, ly + 14);
            ctx.quadraticCurveTo(lx + 4, ly + 25, lx + 2, ly + 50);
            ctx.quadraticCurveTo(lx + 12, ly + 40, lx + 24, ly + 32);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#f472b6";
            ctx.beginPath();
            ctx.moveTo(lx + 26, ly + 32);
            ctx.lineTo(lx + 44, ly + 32);
            ctx.lineTo(lx + 56, ly + 78);
            ctx.lineTo(lx + 10, ly + 78);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#db2777";
            ctx.beginPath();
            ctx.moveTo(lx + 26, ly + 40);
            ctx.lineTo(lx + 48, ly + 78);
            ctx.lineTo(lx + 18, ly + 78);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#be185d";
            ctx.fillRect(lx + 10, ly + 70, 46, 8);

            ctx.fillStyle = "#f472b6";
            ctx.beginPath();
            ctx.arc(lx + 28, ly + 32, 9, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(lx + 44, ly + 36, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#3b82f6";
            ctx.beginPath();
            ctx.arc(lx + 28, ly + 30, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#fef2f2";
            ctx.beginPath();
            ctx.arc(lx + 28, ly + 20, 11, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f43f5e";
            ctx.beginPath();
            ctx.arc(lx + 37, ly + 21, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.arc(lx + 26, ly + 14, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#3b82f6";
            ctx.beginPath();
            ctx.arc(lx + 32, ly + 23, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ca8a04";
            ctx.beginPath();
            ctx.arc(lx + 28, ly + 35, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#3b82f6";
            ctx.beginPath();
            ctx.arc(lx + 28, ly + 35, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#eab308";
            ctx.fillRect(lx + 18, ly + 2, 20, 6);
            ctx.beginPath();
            ctx.moveTo(lx + 18, ly + 2);
            ctx.lineTo(lx + 18, ly - 6);
            ctx.lineTo(lx + 22, ly + 2);
            ctx.lineTo(lx + 28, ly - 9);
            ctx.lineTo(lx + 34, ly + 2);
            ctx.lineTo(lx + 38, ly - 6);
            ctx.lineTo(lx + 38, ly + 2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(lx + 28, ly + 4, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#3b82f6";
            ctx.beginPath();
            ctx.arc(lx + 22, ly + 5, 2, 0, Math.PI * 2);
            ctx.arc(lx + 34, ly + 5, 2, 0, Math.PI * 2);
            ctx.fill();

            let cStr = Math.floor(score).toString().padStart(5, '0');
            let hStr = Math.floor(highscore).toString().padStart(5, '0');
            ctx.fillStyle = "#000000";
            ctx.font = "bold 18px 'Courier New', monospace";
            ctx.fillText(`HI: ${hStr}   ${cStr}`, canvas.width - 225, 32);
            ctx.fillStyle = "#ffffff";
            ctx.fillText(`HI: ${hStr}   ${cStr}`, canvas.width - 227, 30);

            if (!gameStarted) {
                ctx.fillStyle = "rgba(9, 13, 22, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#c084fc";
                ctx.font = "bold 26px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("SUPER PRINCESA LUNA", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "15px 'Courier New', monospace";
                ctx.fillText("Toque ou clique para iniciar a aventura", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 32px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("FIM DE JOGO", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px 'Courier New', monospace";
                ctx.fillText("Toque na tela ou clique para reiniciar", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
